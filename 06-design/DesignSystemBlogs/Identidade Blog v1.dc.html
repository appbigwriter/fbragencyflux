<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-bd15c425-53b9-4883-b46d-6ecda90ef625/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;700&display=swap">
<script src="_ds/nocturne-bd15c425-53b9-4883-b46d-6ecda90ef625/_ds_bundle.js"></script>
<script src="./image-slot.js"</script>
<style>
  html, body { margin: 0; padding: 0; }
  a { color: var(--blog-accent-ink); text-decoration: none; }
  a:hover { color: var(--blog-accent); text-decoration: underline; }
</style>
</helmet>

<div style="{{ shell }}">
  <div style="min-height:100vh;background:var(--blog-bg);color:var(--blog-text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55;padding-bottom:80px">

    <div style="position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 24px;background:var(--blog-surface);border-bottom:1px solid var(--blog-line)">
      <span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blog-muted);margin-right:6px">Tema do blog</span>
      <sc-for list="{{ presets }}" as="p" hint-placeholder-count="4">
        <button onClick="{{ p.pick }}" style="{{ p.tabStyle }}" style-hover="opacity:.85">
          <span style="{{ p.dotStyle }}"></span>{{ p.nome }}
        </button>
      </sc-for>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--blog-muted)">{{ resumoTema }}</span>
    </div>

    <div style="max-width:1180px;margin:0 auto;padding:0 24px">

      <header style="padding:64px 0 40px;display:grid;gap:16px;max-width:720px">
        <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blog-accent-ink)">Identidade visual · kit base</span>
        <h1 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:44px;line-height:1.08;letter-spacing:-.02em">Um sistema, qualquer nicho</h1>
        <p style="margin:0;font-size:17px;color:var(--blog-muted);text-wrap:pretty">A estrutura, a hierarquia e os componentes são fixos. O que muda de blog para blog são cinco variáveis: matiz do destaque, claro ou escuro, fonte de título, raio dos cantos e densidade. Troque o tema acima para ver o mesmo layout vestido de outro jeito.</p>
      </header>

      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:calc(var(--blog-u)*2);padding:24px 0 56px;border-top:1px solid var(--blog-line)">
        <div style="display:grid;gap:10px;align-content:start">
          <h2 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Rampa do destaque</h2>
          <div style="display:flex;border-radius:var(--blog-r);overflow:hidden;height:56px">
            <sc-for list="{{ rampa }}" as="r" hint-placeholder-count="9">
              <div style="{{ r.style }}"></div>
            </sc-for>
          </div>
          <p style="margin:0;font-size:12px;color:var(--blog-muted)">Nove degraus gerados de um único matiz. Trocar o matiz regenera a rampa inteira sem tocar no layout.</p>
        </div>
        <div style="display:grid;gap:10px;align-content:start">
          <h2 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Papel e tinta</h2>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
            <div style="height:56px;border-radius:var(--blog-r);background:var(--blog-bg);border:1px solid var(--blog-line)"></div>
            <div style="height:56px;border-radius:var(--blog-r);background:var(--blog-surface);border:1px solid var(--blog-line)"></div>
            <div style="height:56px;border-radius:var(--blog-r);background:var(--blog-accent-soft);border:1px solid var(--blog-line)"></div>
            <div style="height:56px;border-radius:var(--blog-r);background:var(--blog-text)"></div>
          </div>
          <p style="margin:0;font-size:12px;color:var(--blog-muted)">Fundo, superfície, tinta suave do destaque e texto. Quatro fundos no total — nenhum preto ou branco puro.</p>
        </div>
        <div style="display:grid;gap:10px;align-content:start">
          <h2 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Tipografia</h2>
          <div style="font-family:var(--blog-head);font-weight:500;font-size:34px;line-height:1;letter-spacing:-.02em">Aa Gg 24</div>
          <div style="font-size:13px;color:var(--blog-muted)">{{ nomeFonte }} nos títulos · Inter no corpo · corpo 17px / entrelinha 1.7 no artigo</div>
        </div>
      </section>

      <section style="padding:0 0 56px;display:grid;gap:calc(var(--blog-u)*2)">
        <h2 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Componentes</h2>
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
          <button style="padding:calc(var(--blog-u)*.8) calc(var(--blog-u)*1.6);border-radius:var(--blog-r);border:1px solid var(--blog-accent);background:transparent;color:var(--blog-accent-ink);font:inherit;font-size:14px;cursor:pointer" style-hover="background:var(--blog-accent-soft)">Assinar a newsletter</button>
          <button style="padding:calc(var(--blog-u)*.8) calc(var(--blog-u)*1.6);border-radius:var(--blog-r);border:1px solid var(--blog-line);background:transparent;color:var(--blog-text);font:inherit;font-size:14px;cursor:pointer" style-hover="border-color:var(--blog-accent)">Ver categoria</button>
          <button style="padding:calc(var(--blog-u)*.8) calc(var(--blog-u)*.6);border:0;background:transparent;color:var(--blog-accent-ink);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Ler mais</button>
          <span style="padding:4px 10px;border-radius:999px;background:var(--blog-accent-soft);color:var(--blog-accent-ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase">Categoria</span>
          <span style="padding:4px 10px;border-radius:999px;border:1px solid var(--blog-line);color:var(--blog-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase">Etiqueta</span>
          <span style="padding:4px 10px;border-radius:999px;border:1px dashed var(--blog-accent);color:var(--blog-accent-ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase">Afiliado</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:calc(var(--blog-u)*1.5)">
          <div style="background:var(--blog-surface);border:1px solid var(--blog-line);border-radius:var(--blog-r-lg);padding:calc(var(--blog-u)*1.5);display:grid;gap:8px">
            <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-accent-ink)">Card de artigo</span>
            <h3 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:19px;line-height:1.25">Título em duas linhas, cortado com elegância</h3>
            <p style="margin:0;font-size:14px;color:var(--blog-muted)">Um resumo de uma ou duas frases, no máximo.</p>
            <span style="font-size:12px;color:var(--blog-muted)">6 min · 12 set</span>
          </div>
          <div style="display:grid;gap:8px;align-content:start">
            <label style="font-size:12px;color:var(--blog-muted)">Campo de e-mail</label>
            <input type="email" placeholder="voce@email.com" style="padding:calc(var(--blog-u)*.9) calc(var(--blog-u)*1.1);border-radius:var(--blog-r);border:1px solid var(--blog-line);background:var(--blog-surface);color:var(--blog-text);font:inherit;font-size:14px;width:100%;box-sizing:border-box">
            <span style="font-size:12px;color:var(--blog-muted)">Foco sempre visível: contorno de 2px no destaque.</span>
          </div>
          <div style="display:grid;place-items:center;border:1px dashed var(--blog-line);border-radius:var(--blog-r);min-height:100px;color:var(--blog-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase">Slot de anúncio · 300 × 250</div>
        </div>
      </section>

      <section style="padding:0 0 24px;border-top:1px solid var(--blog-line)">
        <h2 style="margin:32px 0 16px;font-family:var(--blog-head);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Home aplicada</h2>

        <div style="border:1px solid var(--blog-line);border-radius:var(--blog-r-lg);overflow:hidden;background:var(--blog-bg)">
          <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:calc(var(--blog-u)*1.5);padding:calc(var(--blog-u)*1.4) calc(var(--blog-u)*2);border-bottom:1px solid var(--blog-line);background:var(--blog-surface)">
            <span style="font-family:var(--blog-head);font-weight:500;font-size:20px;letter-spacing:-.01em">{{ nome }}</span>
            <span style="font-size:12px;color:var(--blog-muted)">{{ tagline }}</span>
            <span style="flex:1"></span>
            <nav style="display:flex;flex-wrap:wrap;gap:calc(var(--blog-u)*1.4);font-size:13px;color:var(--blog-muted)">
              <sc-for list="{{ categorias }}" as="c" hint-placeholder-count="4">
                <a href="#" style="color:inherit" style-hover="color:var(--blog-accent-ink)">{{ c }}</a>
              </sc-for>
            </nav>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:calc(var(--blog-u)*2);padding:calc(var(--blog-u)*2.4)">
            <div style="display:grid;gap:14px;align-content:start">
              <span style="padding:4px 10px;border-radius:999px;background:var(--blog-accent-soft);color:var(--blog-accent-ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase;width:max-content">{{ heroKicker }}</span>
              <h3 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:38px;line-height:1.1;letter-spacing:-.02em;text-wrap:pretty">{{ heroTitulo }}</h3>
              <p style="margin:0;font-size:16px;color:var(--blog-muted);text-wrap:pretty">{{ heroDek }}</p>
              <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--blog-muted)">
                <span style="width:26px;height:26px;border-radius:999px;background:var(--blog-accent-soft);display:inline-block"></span>
                {{ autor }} · 12 set · 7 min
              </div>
            </div>
            <div class="{{ classeImagem }}" style="border-radius:var(--blog-r-lg);overflow:hidden;min-height:240px">
              <image-slot id="blog-hero" shape="rect" placeholder="Imagem de capa — assunto em fundo escuro"></image-slot>
            </div>
          </div>

          <div style="display:grid;place-items:center;margin:0 calc(var(--blog-u)*2.4) calc(var(--blog-u)*2.4);border:1px dashed var(--blog-line);border-radius:var(--blog-r);min-height:74px;color:var(--blog-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase">Slot de anúncio · 728 × 90</div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:calc(var(--blog-u)*1.6);padding:0 calc(var(--blog-u)*2.4) calc(var(--blog-u)*2.4)">
            <sc-for list="{{ posts }}" as="a" hint-placeholder-count="4">
              <article style="display:grid;gap:10px;align-content:start;background:var(--blog-surface);border:1px solid var(--blog-line);border-radius:var(--blog-r-lg);padding:calc(var(--blog-u)*1.4)">
                <div style="height:96px;border-radius:var(--blog-r);background:var(--blog-accent-soft);display:grid;place-items:center;color:var(--blog-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase">Imagem</div>
                <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blog-accent-ink)">{{ a.cat }}</span>
                <h4 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:17px;line-height:1.25;text-wrap:pretty">{{ a.titulo }}</h4>
                <span style="font-size:12px;color:var(--blog-muted)">{{ a.meta }}</span>
              </article>
            </sc-for>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:calc(var(--blog-u)*2);padding:calc(var(--blog-u)*2.4);border-top:1px solid var(--blog-line);background:var(--blog-surface)">
            <div style="display:grid;gap:10px;align-content:start">
              <h4 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:22px;line-height:1.2">Uma carta por semana</h4>
              <p style="margin:0;font-size:14px;color:var(--blog-muted)">O que foi publicado, mais uma nota curta que não vira artigo.</p>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <input type="email" placeholder="voce@email.com" style="flex:1;min-width:180px;padding:calc(var(--blog-u)*.9) calc(var(--blog-u)*1.1);border-radius:var(--blog-r);border:1px solid var(--blog-line);background:var(--blog-bg);color:var(--blog-text);font:inherit;font-size:14px">
                <button style="padding:calc(var(--blog-u)*.9) calc(var(--blog-u)*1.5);border-radius:var(--blog-r);border:1px solid var(--blog-accent);background:transparent;color:var(--blog-accent-ink);font:inherit;font-size:14px;cursor:pointer" style-hover="background:var(--blog-accent-soft)">Assinar</button>
              </div>
            </div>
            <div style="display:grid;gap:10px;align-content:start">
              <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Mais lidas</span>
              <sc-for list="{{ posts }}" as="a" hint-placeholder-count="4">
                <a href="#" style="display:flex;gap:12px;font-size:14px;color:var(--blog-text);padding:6px 0;border-bottom:1px solid var(--blog-line)" style-hover="color:var(--blog-accent-ink)">
                  <span style="color:var(--blog-muted);font-variant-numeric:tabular-nums">{{ a.n }}</span>{{ a.titulo }}
                </a>
              </sc-for>
            </div>
          </div>
        </div>
      </section>

      <section style="padding:32px 0 0;border-top:1px solid var(--blog-line)">
        <h2 style="margin:32px 0 16px;font-family:var(--blog-head);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Artigo aplicado</h2>

        <div style="border:1px solid var(--blog-line);border-radius:var(--blog-r-lg);overflow:hidden;background:var(--blog-bg);padding:calc(var(--blog-u)*2.4)">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:calc(var(--blog-u)*3)">
            <div style="display:grid;gap:calc(var(--blog-u)*1.6);max-width:680px">
              <span style="font-size:12px;color:var(--blog-muted)">{{ nome }} › {{ heroKicker }}</span>
              <h3 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:34px;line-height:1.12;letter-spacing:-.02em;text-wrap:pretty">{{ heroTitulo }}</h3>
              <p style="margin:0;font-size:19px;line-height:1.5;color:var(--blog-muted);text-wrap:pretty">{{ heroDek }}</p>
              <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--blog-muted);padding-bottom:calc(var(--blog-u)*.8);border-bottom:1px solid var(--blog-line)">
                <span style="width:26px;height:26px;border-radius:999px;background:var(--blog-accent-soft);display:inline-block"></span>
                Por {{ autor }} · 12 de setembro de 2026 · 7 min de leitura
              </div>
              <div class="{{ classeImagem }}" style="border-radius:var(--blog-r-lg);overflow:hidden;min-height:260px">
                <image-slot id="blog-artigo" shape="rect" placeholder="Imagem do artigo"></image-slot>
              </div>
              <p style="margin:0;font-size:17px;line-height:1.7;text-wrap:pretty">A primeira linha do corpo do texto começa em 17px com entrelinha 1,7 e largura máxima de 680px — cerca de 70 caracteres por linha, que é onde a leitura corrida se sustenta sem cansar. Parágrafos nunca passam de cinco linhas na largura de leitura.</p>
              <p style="margin:0;font-size:17px;line-height:1.7;text-wrap:pretty">Subtítulos dividem o texto a cada três ou quatro parágrafos, na fonte de título, sempre alinhados à esquerda. Listas, citações e tabelas herdam a mesma tinta e o mesmo raio dos cantos do resto do sistema.</p>
              <blockquote style="margin:0;padding-left:calc(var(--blog-u)*1.5);border-left:2px solid var(--blog-accent);font-family:var(--blog-head);font-size:21px;line-height:1.35">Uma citação ocupa a largura de leitura e nunca vira imagem — precisa poder ser selecionada e lida por leitores de tela.</blockquote>
              <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:calc(var(--blog-u)*1.4);align-items:center;border:1px solid var(--blog-accent);border-radius:var(--blog-r-lg);padding:calc(var(--blog-u)*1.4);background:var(--blog-accent-soft)">
                <div style="height:96px;border-radius:var(--blog-r);background:var(--blog-surface);display:grid;place-items:center;color:var(--blog-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase">Produto</div>
                <div style="display:grid;gap:8px">
                  <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blog-accent-ink)">Recomendação testada</span>
                  <h4 style="margin:0;font-family:var(--blog-head);font-weight:500;font-size:18px;line-height:1.25">Nome do produto, modelo e o que ele resolve em uma linha</h4>
                  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
                    <button style="padding:calc(var(--blog-u)*.8) calc(var(--blog-u)*1.4);border-radius:var(--blog-r);border:1px solid var(--blog-accent);background:transparent;color:var(--blog-accent-ink);font:inherit;font-size:13px;cursor:pointer" style-hover="background:var(--blog-surface)">Ver preço</button>
                    <span style="font-size:11px;color:var(--blog-muted);max-width:340px">Link de afiliado. Se você comprar por aqui, o blog recebe comissão e o preço para você é o mesmo.</span>
                  </div>
                </div>
              </div>
              <p style="margin:0;font-size:17px;line-height:1.7;text-wrap:pretty">O bloco de recomendação aparece no meio do texto, uma vez por artigo, e sempre com a divulgação visível ao lado do botão. É o único componente que usa fundo tingido no destaque.</p>
            </div>

            <aside style="display:grid;gap:calc(var(--blog-u)*1.6);align-content:start;font-size:13px;max-width:300px">
              <div style="display:grid;gap:8px;background:var(--blog-surface);border:1px solid var(--blog-line);border-radius:var(--blog-r-lg);padding:calc(var(--blog-u)*1.3)">
                <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Neste artigo</span>
                <a href="#" style="color:var(--blog-text)" style-hover="color:var(--blog-accent-ink)">O que foi testado</a>
                <a href="#" style="color:var(--blog-text)" style-hover="color:var(--blog-accent-ink)">Como medir em casa</a>
                <a href="#" style="color:var(--blog-text)" style-hover="color:var(--blog-accent-ink)">O que eu faria diferente</a>
              </div>
              <div style="display:grid;place-items:center;border:1px dashed var(--blog-line);border-radius:var(--blog-r);min-height:200px;color:var(--blog-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:12px">Slot de anúncio<br>300 × 250</div>
              <div style="display:grid;gap:10px;align-content:start">
                <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blog-muted)">Do mesmo assunto</span>
                <sc-for list="{{ posts }}" as="a" hint-placeholder-count="3">
                  <a href="#" style="color:var(--blog-text);line-height:1.35;padding:6px 0;border-bottom:1px solid var(--blog-line);display:block" style-hover="color:var(--blog-accent-ink)">{{ a.titulo }}</a>
                </sc-for>
              </div>
            </aside>
          </div>
        </div>
      </section>

      <footer style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;padding:40px 0 0;margin-top:40px;border-top:1px solid var(--blog-line);font-size:12px;color:var(--blog-muted)">
        <span>{{ nome }} · {{ tagline }}</span>
        <span style="display:flex;gap:16px;flex-wrap:wrap">
          <a href="#" style="color:inherit">Sobre</a>
          <a href="#" style="color:inherit">Política de privacidade</a>
          <a href="#" style="color:inherit">Divulgação de afiliados</a>
          <a href="#" style="color:inherit">Contato</a>
        </span>
      </footer>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;temaInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dinheiro Claro&quot;,&quot;Depois dos Quarenta&quot;,&quot;Sinal Aberto&quot;,&quot;Corpo Presente&quot;],&quot;default&quot;:&quot;Sinal Aberto&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;densidade&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.7,&quot;max&quot;:1.4,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  presets = [
    { nome: "Dinheiro Claro", nicho: "finanças pessoais", tagline: "Finanças pessoais sem jargão",
      hue: 162, modo: "claro", fonte: "Inter", raio: 4, u: 10, autor: "Renata Villas",

  constructor(props) {

    const escala = this.props.densidade ?? 1;

    const shell = {
      "--blog-bg": claro ? ok(0.985, 0.008) : ok(0.215, 0.022),
      "--blog-surface": claro ? ok(0.955, 0.014) : ok(0.265, 0.026),

      "--blog-accent": claro ? ok(0.56, 0.145) : ok(0.69, 0.125),

      "--blog-r-lg": Math.round(p.raio * 1.8) + "px",
      "--blog-head": this.fontes[p.fonte]
    };

    }));

    const presets = this.presets.map((q, n) => ({
      nome: q.nome,
      pick: () => this.setState({ i: n }),
      tabStyle: {
        display: "flex", alignItems: "center", gap: "7px", font: "inherit", fontSize: "13px",
        padding: "6px 12px", cursor: "pointer", borderRadius: "999px",
        border: "1px solid " + (n === i ? "var(--blog-accent)" : "var(--blog-line)"),
        background: n === i ? "var(--blog-accent-soft)" : "transparent",
        color: n === i ? "var(--blog-accent-ink)" : "var(--blog-muted)"
      },
      dotStyle: {
        width: "9px", height: "9px", borderRadius: "999px", display: "inline-block",
